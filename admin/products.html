<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - FreshHut Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div class="adm-layout">

    <aside class="adm-sidebar">
        <div class="adm-brand">
            <div class="adm-brand-icon">
                <svg viewBox="0 0 40 40" width="38" height="38"><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2e7d32"/><stop offset="1" stop-color="#66bb6a"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="url(#g1)"/><path d="M20 9c-1 4-5 5-5 10 0 4 3 7 5 7s5-3 5-7c0-5-4-6-5-10z" fill="#fff"/><path d="M20 14v14" stroke="#2e7d32" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <div class="adm-brand-txt">
                <div class="adm-brand-name">FreshHut</div>
                <div class="adm-brand-sub">Admin Panel</div>
            </div>
        </div>
        <nav class="adm-nav">
            <div class="adm-nav-section-label">Main</div>
            <a href="index.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <div class="adm-nav-section-label">Manage</div>
            <a href="products.html" class="adm-nav-link active">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                Products
            </a>
            <a href="orders.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                Orders
            </a>
            <a href="users.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                Users
            </a>
            <div class="adm-nav-divider"></div>
            <a href="../index.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                View Store
            </a>
            <a href="#" class="adm-nav-link nav-danger" onclick="adminLogout()">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </nav>
        <div class="adm-sidebar-footer">
            <div class="adm-footer-user">
                <div class="adm-footer-avatar" id="adm-avatar">A</div>
                <div>
                    <div class="adm-footer-name" id="adm-footer-name">Admin</div>
                    <div class="adm-footer-role">Administrator</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="adm-main">
        <div class="adm-topbar">
            <div class="adm-topbar-title">Manage Products</div>

        </div>

        <div class="adm-content">
            <div class="adm-table-card">
                <div class="adm-table-hd">
                    <div class="adm-table-ttl">All Products</div>
                    <div class="adm-table-actions">
                        <input type="text" class="adm-search" id="prod-search" placeholder="Search products..." oninput="filterProducts()">
                        <select class="adm-select" id="prod-cat-filter" onchange="filterProducts()">
                            <option value="">All Categories</option>
                        </select>
                        <button class="adm-btn adm-btn-primary" onclick="openAddModal()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Product
                        </button>
                    </div>
                </div>
                <div id="products-table-wrap">
                    <div class="adm-loading"><div class="adm-spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add / Edit Product Modal -->
<div class="adm-modal-overlay" id="product-modal">
    <div class="adm-modal">
        <div class="adm-modal-hd">
            <div class="adm-modal-ttl" id="modal-title">Add New Product</div>
            <button class="adm-modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="adm-modal-body">
            <input type="hidden" id="p-id">
            <input type="hidden" id="p-existing-image" value="default.jpg">

            <div class="adm-form-row">
                <div class="adm-form-group">
                    <label>Product Name</label>
                    <input type="text" id="p-name" placeholder="e.g. Fresh Tomatoes">
                </div>
                <div class="adm-form-group">
                    <label>Category</label>
                    <select id="p-cat"><option value="">-- Select Category --</option></select>
                </div>
            </div>
            <div class="adm-form-row">
                <div class="adm-form-group">
                    <label>Price (&#2547;)</label>
                    <input type="number" id="p-price" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="adm-form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="p-stock" placeholder="0" min="0">
                </div>
            </div>
            <div class="adm-form-row single">
                <div class="adm-form-group">
                    <label>Description</label>
                    <textarea id="p-desc" rows="2" placeholder="Brief product description..."></textarea>
                </div>
            </div>
            <div class="adm-form-row single">
                <div class="adm-form-group">
                    <label>Product Image</label>
                    <input type="file" id="p-image" accept="image/*" onchange="previewImage(this)">
                    <div id="img-preview" style="margin-top:10px;"></div>
                </div>
            </div>
        </div>
        <div class="adm-modal-footer">
            <button class="adm-btn adm-btn-primary" onclick="saveProduct()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
                Save Product
            </button>
            <button class="adm-btn adm-btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="../js/product-img.js"></script>
<script src="../js/admin.js"></script>
<script>
let allProducts = [];
let allCategories = [];

const PRODUCT_IMAGES = {
    vegetables:'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=80&h=80&fit=crop',
    fruits:'https://images.unsplash.com/photo-1519996529931-28324d5a630e?w=80&h=80&fit=crop',
    dairy:'https://images.unsplash.com/photo-1563636619-e9143da7973b?w=80&h=80&fit=crop',
    bakery:'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=80&h=80&fit=crop',
    beverages:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=80&h=80&fit=crop',
    snacks:'https://images.unsplash.com/photo-1599490659213-e2b9527bd087?w=80&h=80&fit=crop',
    frozen:'https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=80&h=80&fit=crop',
    meat:'https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=80&h=80&fit=crop',
    seafood:'https://images.unsplash.com/photo-1565680018434-b513d5e5fd47?w=80&h=80&fit=crop',
};
const DEFAULT_IMG = 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=80&h=80&fit=crop';

function getProductImg(p) {
    if (p.image && p.image !== 'default.jpg') return `../uploads/products/${p.image}`;
    return PROD_IMG.byName(p.name || '', p.category || '', 80, 80);
}
function escHtml(str) { const d=document.createElement('div');d.textContent=String(str||'');return d.innerHTML; }
function showToast2(msg,type='success'){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>{t.className='toast';},3200);}

document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('user')||'null');
    if (user) {
        const n = document.getElementById('adm-footer-name');
        const a = document.getElementById('adm-avatar');
        if (n) n.textContent = user.name || 'Admin';
        if (a && user.name) a.textContent = user.name.charAt(0).toUpperCase();
    }
    loadProducts();
    loadCats();
});

async function loadProducts() {
    try {
        const res  = await fetch('../api/products.php?action=list', { credentials: 'include' });
        const data = await res.json();
        allProducts = data.products || [];
        renderProducts(allProducts);
    } catch {
        document.getElementById('products-table-wrap').innerHTML = `<div style="padding:24px;color:#c62828;font-weight:700;">Failed to load products.</div>`;
    }
}

async function loadCats() {
    try {
        const res  = await fetch('../api/products.php?action=categories', { credentials: 'include' });
        const data = await res.json();
        allCategories = data.categories || [];

        const catFilter = document.getElementById('prod-cat-filter');
        const pCat      = document.getElementById('p-cat');
        allCategories.forEach(c => {
            const opt1 = new Option(c.name, c.id);
            const opt2 = new Option(c.name, c.id);
            if (catFilter) catFilter.appendChild(opt1);
            if (pCat)      pCat.appendChild(opt2);
        });
    } catch {}
}

function filterProducts() {
    const search = (document.getElementById('prod-search')?.value || '').toLowerCase();
    const catId  = document.getElementById('prod-cat-filter')?.value || '';
    const filtered = allProducts.filter(p => {
        const matchSearch = !search ||
            (p.name||'').toLowerCase().includes(search) ||
            (p.category||'').toLowerCase().includes(search);
        const matchCat = !catId || String(p.category_id) === catId;
        return matchSearch && matchCat;
    });
    renderProducts(filtered);
}

function renderProducts(products) {
    const wrap = document.getElementById('products-table-wrap');
    if (!products.length) {
        wrap.innerHTML = `<div class="adm-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="1.5"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg><p>No products found.</p></div>`;
        return;
    }
    wrap.innerHTML = `<div style="overflow-x:auto;"><table class="adm-tbl">
        <thead><tr>
            <th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>${products.map(p => `
        <tr>
            <td>
                <div style="display:flex;align-items:center;gap:12px;">
                    <img src="${getProductImg(p)}" alt="${escHtml(p.name)}" class="adm-product-thumb" onerror="this.src='${DEFAULT_IMG}'" style="cursor:pointer;" onclick="openEditModal('${escHtml(String(p.id))}')">
                    <div>
                        <span class="adm-product-name">${escHtml(p.name)}</span>
                        <span class="adm-product-cat">${escHtml((p.description||'').substring(0,50))}</span>
                    </div>
                </div>
            </td>
            <td><span class="adm-badge ab-blue">${escHtml(p.category||'—')}</span></td>
            <td><strong>&#2547;${parseFloat(p.price).toFixed(2)}</strong></td>
            <td>
                <span style="font-weight:700;${parseInt(p.stock)<10?'color:#e65100;':'color:#2e7d32;'}">${parseInt(p.stock)}</span>
            </td>
            <td>${parseInt(p.stock)>10?'<span class="adm-badge ab-green">In Stock</span>':parseInt(p.stock)>0?'<span class="adm-badge ab-orange">Low Stock</span>':'<span class="adm-badge ab-red">Out of Stock</span>'}</td>
            <td>
                <div style="display:flex;gap:7px;">
                    <button class="adm-btn adm-btn-blue adm-btn-sm" onclick="openEditModal('${escHtml(String(p.id))}')">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        Edit
                    </button>
                    <button class="adm-btn adm-btn-danger adm-btn-sm" onclick="deleteProduct('${escHtml(String(p.id))}', '${escHtml(p.name)}')">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
                        Delete
                    </button>
                </div>
            </td>
        </tr>`).join('')}
        </tbody></table></div>`;
}

function openAddModal() {
    document.getElementById('modal-title').textContent = 'Add New Product';
    document.getElementById('p-id').value = '';
    document.getElementById('p-name').value = '';
    document.getElementById('p-cat').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-stock').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-existing-image').value = 'default.jpg';
    document.getElementById('img-preview').innerHTML = '';
    document.getElementById('product-modal').classList.add('open');
}

function openEditModal(productId) {
    const p = allProducts.find(x => String(x.id) === String(productId));
    if (!p) return;
    document.getElementById('modal-title').textContent = 'Edit Product';
    document.getElementById('p-id').value     = p.id;
    document.getElementById('p-name').value   = p.name;
    document.getElementById('p-cat').value    = p.category_id || '';
    document.getElementById('p-price').value  = p.price;
    document.getElementById('p-stock').value  = p.stock;
    document.getElementById('p-desc').value   = p.description || '';
    document.getElementById('p-existing-image').value = p.image || 'default.jpg';
    const img = getProductImg(p);
    document.getElementById('img-preview').innerHTML = `<img src="${img}" alt="${escHtml(p.name)}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;border:2px solid #e8ede8;" onerror="this.style.display='none'">`;
    document.getElementById('product-modal').classList.add('open');
}

function closeModal() {
    document.getElementById('product-modal').classList.remove('open');
}

function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('img-preview').innerHTML = `<img src="${e.target.result}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;border:2px solid #6CB023;">`;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function saveProduct() {
    const id    = document.getElementById('p-id').value;
    const name  = document.getElementById('p-name').value.trim();
    const catId = document.getElementById('p-cat').value;
    const price = document.getElementById('p-price').value;
    const stock = document.getElementById('p-stock').value;
    const desc  = document.getElementById('p-desc').value.trim();
    const imgFile = document.getElementById('p-image').files[0];
    const existingImg = document.getElementById('p-existing-image').value;

    if (!name || !catId || !price) {
        showToast2('Name, category, and price are required.', 'error'); return;
    }

    const formData = new FormData();
    const actionVerb = id ? 'update' : 'add';
    if (id) formData.append('id', id);
    formData.append('name', name);
    formData.append('category_id', catId);
    formData.append('price', price);
    formData.append('stock', stock || 0);
    formData.append('description', desc);
    formData.append('existing_image', existingImg);
    if (imgFile) formData.append('image', imgFile);

    try {
        const res  = await fetch(`../api/products.php?action=${actionVerb}`, { method: 'POST', body: formData, credentials: 'include' });
        const data = await res.json();
        if (data.status === 'success') {
            showToast2(id ? 'Product updated' : 'Product added');
            closeModal();
            loadProducts();
        } else {
            showToast2(data.message || 'Save failed', 'error');
        }
    } catch {
        showToast2('Connection error', 'error');
    }
}

async function deleteProduct(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
        const res  = await fetch(`../api/products.php?action=delete&id=${encodeURIComponent(id)}`, {
            method: 'GET',
            credentials: 'include'
        });
        const data = await res.json();
        if (data.status === 'success') {
            showToast2('Product deleted');
            loadProducts();
        } else {
            showToast2(data.message || 'Delete failed', 'error');
        }
    } catch { showToast2('Connection error', 'error'); }
}

document.getElementById('product-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('product-modal')) closeModal();
});
</script>
</body>
</html>
