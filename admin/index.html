<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FreshHut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div class="adm-layout">

    <!-- Sidebar -->
    <aside class="adm-sidebar">
        <div class="adm-brand">
            <div class="adm-brand-icon">
                <svg viewBox="0 0 40 40" width="38" height="38"><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2e7d32"/><stop offset="1" stop-color="#66bb6a"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="url(#g1)"/><path d="M20 9c-1 4-5 5-5 10 0 4 3 7 5 7s5-3 5-7c0-5-4-6-5-10z" fill="#fff"/><path d="M20 14v14" stroke="#2e7d32" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <div class="adm-brand-txt">
                <div class="adm-brand-name">FreshHut</div>
                <div class="adm-brand-sub">Admin Panel</div>
            </div>
        </div>
        <nav class="adm-nav">
            <div class="adm-nav-section-label">Main</div>
            <a href="index.html" class="adm-nav-link active">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <div class="adm-nav-section-label">Manage</div>
            <a href="products.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                Products
            </a>
            <a href="orders.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                Orders
            </a>
            <a href="users.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                Users
            </a>
            <div class="adm-nav-divider"></div>
            <a href="../index.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                View Store
            </a>
            <a href="#" class="adm-nav-link nav-danger" onclick="adminLogout()">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </nav>
        <div class="adm-sidebar-footer">
            <div class="adm-footer-user">
                <div class="adm-footer-avatar" id="adm-avatar">A</div>
                <div>
                    <div class="adm-footer-name" id="adm-footer-name">Admin</div>
                    <div class="adm-footer-role">Administrator</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="adm-main">
        <div class="adm-topbar">
            <div class="adm-topbar-title">Dashboard Overview</div>

        </div>

        <div class="adm-content">
            <div class="adm-stat-grid" id="stat-grid">
                <div class="adm-loading" style="grid-column:1/-1;">
                    <div class="adm-spinner"></div>
                    <p style="color:#aaa;font-size:13px;margin-top:8px;">Loading stats...</p>
                </div>
            </div>

            <div class="adm-table-card">
                <div class="adm-table-hd">
                    <div class="adm-table-ttl">Recent Orders</div>
                    <a href="orders.html" class="adm-btn adm-btn-ghost adm-btn-sm">View All Orders</a>
                </div>
                <div id="recent-orders-wrap">
                    <div class="adm-loading"><div class="adm-spinner"></div></div>
                </div>
            </div>

            <div class="adm-table-card">
                <div class="adm-table-hd">
                    <div class="adm-table-ttl">Product Inventory</div>
                    <a href="products.html" class="adm-btn adm-btn-ghost adm-btn-sm">Manage Products</a>
                </div>
                <div id="products-preview-wrap">
                    <div class="adm-loading"><div class="adm-spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="../js/product-img.js"></script>
<script src="../js/admin.js"></script>
<script>
// Set admin name
document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('user')||'null');
    if (user) {
        const n = document.getElementById('adm-footer-name');
        const a = document.getElementById('adm-avatar');
        if (n) n.textContent = user.name || 'Admin';
        if (a && user.name) a.textContent = user.name.charAt(0).toUpperCase();
    }
    loadDashboardV2();
});

const PRODUCT_IMAGES_ADM = {
    vegetables:'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=80&h=80&fit=crop',
    fruits:'https://images.unsplash.com/photo-1519996529931-28324d5a630e?w=80&h=80&fit=crop',
    dairy:'https://images.unsplash.com/photo-1563636619-e9143da7973b?w=80&h=80&fit=crop',
    bakery:'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=80&h=80&fit=crop',
    beverages:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=80&h=80&fit=crop',
    snacks:'https://images.unsplash.com/photo-1599490659213-e2b9527bd087?w=80&h=80&fit=crop',
    meat:'https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=80&h=80&fit=crop',
    meats:'https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=80&h=80&fit=crop',
    seafood:'https://images.unsplash.com/photo-1565680018434-b513d5e5fd47?w=80&h=80&fit=crop',
};
const ADM_DEFAULT_IMG = 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=80&h=80&fit=crop';
function admGetProductImg(p) {
    if (p.image && p.image !== 'default.jpg') return `../uploads/products/${p.image}`;
    return PROD_IMG.byName(p.name || '', p.category || '', 80, 80);
}

const STATUS_META = {
    'Pending':{'cls':'ab-orange','dot':'#f57c00'},
    'Confirmed':{'cls':'ab-blue','dot':'#1565c0'},
    'Processing':{'cls':'ab-purple','dot':'#6a1b9a'},
    'Out for Delivery':{'cls':'ab-green','dot':'#4caf50'},
    'Delivered':{'cls':'ab-green','dot':'#2e7d32'},
    'Cancelled':{'cls':'ab-red','dot':'#c62828'},
};
function statusBadgeAdm(status) {
    const m = STATUS_META[status] || {cls:'ab-gray',dot:'#aaa'};
    return `<span class="adm-badge ${m.cls}"><span style="width:6px;height:6px;border-radius:50%;background:${m.dot};display:inline-block;"></span>${escHtml(status)}</span>`;
}
function escHtml(str) { const d=document.createElement('div');d.textContent=String(str||'');return d.innerHTML; }
function formatDate(ds){if(!ds)return'—';return new Date(ds).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}

async function loadDashboardV2() {
    try {
        const [ordersRes, productsRes, usersRes] = await Promise.all([
            fetch('../api/orders.php?action=all_orders'),
            fetch('../api/products.php?action=list'),
            fetch('../api/users.php?action=list'),
        ]);
        const ordersData   = await ordersRes.json();
        const productsData = await productsRes.json();
        const usersData    = await usersRes.json();

        const orders   = ordersData.orders   || [];
        const products = productsData.products || [];
        const users    = usersData.users     || [];

        const revenue  = orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+parseFloat(o.total_amount||0),0);
        const pending  = orders.filter(o=>o.status==='Pending').length;
        const lowStock = products.filter(p=>parseInt(p.stock)<10).length;

        document.getElementById('stat-grid').innerHTML = `
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-green">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                </div>
                <div class="adm-stat-info">
                    <span class="adm-stat-num">${orders.length}</span>
                    <div class="adm-stat-lbl">Total Orders</div>
                    <div class="adm-stat-change sc-up"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"/></svg>${pending} pending</div>
                </div>
            </div>
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-blue">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                </div>
                <div class="adm-stat-info">
                    <span class="adm-stat-num">&#2547;${revenue.toFixed(0)}</span>
                    <div class="adm-stat-lbl">Revenue (Delivered)</div>
                    <div class="adm-stat-change sc-up"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"/></svg>from delivered orders</div>
                </div>
            </div>
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-orange">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                </div>
                <div class="adm-stat-info">
                    <span class="adm-stat-num">${products.length}</span>
                    <div class="adm-stat-lbl">Total Products</div>
                    <div class="adm-stat-change ${lowStock>0?'sc-down':'sc-up'}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="${lowStock>0?'6 9 12 15 18 9':'18 15 12 9 6 15'}"/></svg>${lowStock} low stock</div>
                </div>
            </div>
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-purple">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                </div>
                <div class="adm-stat-info">
                    <span class="adm-stat-num">${users.length}</span>
                    <div class="adm-stat-lbl">Registered Users</div>
                    <div class="adm-stat-change sc-up"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"/></svg>active customers</div>
                </div>
            </div>`;

        const recent = orders.slice(0,8);
        document.getElementById('recent-orders-wrap').innerHTML = recent.length ?
            `<div style="overflow-x:auto;"><table class="adm-tbl"><thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>
            ${recent.map(o=>`<tr>
                <td><strong style="font-family:'Josefin Sans',sans-serif;font-size:13px;">#${escHtml(String(o.id).slice(-8).toUpperCase())}</strong></td>
                <td>${escHtml(o.customer||'—')}</td>
                <td><strong>&#2547;${parseFloat(o.total_amount).toFixed(2)}</strong></td>
                <td style="color:#666;">${escHtml(o.payment_method||'—')}</td>
                <td>${statusBadgeAdm(o.status)}</td>
                <td style="color:#888;font-size:12.5px;">${formatDate(o.created_at)}</td>
                <td><a href="orders.html" class="adm-btn adm-btn-ghost adm-btn-sm">Manage</a></td>
            </tr>`).join('')}
            </tbody></table></div>` :
            `<div class="adm-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg><p>No orders yet.</p></div>`;

        const topProds = products.slice(0,6);
        document.getElementById('products-preview-wrap').innerHTML = topProds.length ?
            `<div style="overflow-x:auto;"><table class="adm-tbl"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody>
            ${topProds.map(p=>`<tr>
                <td><div style="display:flex;align-items:center;gap:12px;">
                    <img src="${admGetProductImg(p)}" alt="${escHtml(p.name)}" class="adm-product-thumb" onerror="this.src='${ADM_DEFAULT_IMG}'">
                    <div><span class="adm-product-name">${escHtml(p.name)}</span><span class="adm-product-cat">${escHtml((p.description||'').substring(0,40))}</span></div>
                </div></td>
                <td><span class="adm-badge ab-blue">${escHtml(p.category||'—')}</span></td>
                <td><strong>&#2547;${parseFloat(p.price).toFixed(2)}</strong></td>
                <td>${parseInt(p.stock)}</td>
                <td>${parseInt(p.stock)>10?'<span class="adm-badge ab-green">In Stock</span>':parseInt(p.stock)>0?'<span class="adm-badge ab-orange">Low Stock</span>':'<span class="adm-badge ab-red">Out of Stock</span>'}</td>
            </tr>`).join('')}
            </tbody></table></div>` :
            `<div class="adm-empty"><p>No products yet.</p></div>`;

    } catch(e) {
        document.getElementById('stat-grid').innerHTML = `<div style="grid-column:1/-1;padding:24px;color:#c62828;font-weight:700;">Failed to load dashboard. Make sure the server is running.</div>`;
    }
}
</script>
</body>
</html>
