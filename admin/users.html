<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - FreshHut Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div class="adm-layout">

    <aside class="adm-sidebar">
        <div class="adm-brand">
            <div class="adm-brand-icon">
                <svg viewBox="0 0 40 40" width="38" height="38"><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2e7d32"/><stop offset="1" stop-color="#66bb6a"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="url(#g1)"/><path d="M20 9c-1 4-5 5-5 10 0 4 3 7 5 7s5-3 5-7c0-5-4-6-5-10z" fill="#fff"/><path d="M20 14v14" stroke="#2e7d32" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <div class="adm-brand-txt">
                <div class="adm-brand-name">FreshHut</div>
                <div class="adm-brand-sub">Admin Panel</div>
            </div>
        </div>
        <nav class="adm-nav">
            <div class="adm-nav-section-label">Main</div>
            <a href="index.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <div class="adm-nav-section-label">Manage</div>
            <a href="products.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                Products
            </a>
            <a href="orders.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                Orders
            </a>
            <a href="users.html" class="adm-nav-link active">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                Users
            </a>
            <div class="adm-nav-divider"></div>
            <a href="../index.html" class="adm-nav-link">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                View Store
            </a>
            <a href="#" class="adm-nav-link nav-danger" onclick="adminLogout()">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </a>
        </nav>
        <div class="adm-sidebar-footer">
            <div class="adm-footer-user">
                <div class="adm-footer-avatar" id="adm-avatar">A</div>
                <div>
                    <div class="adm-footer-name" id="adm-footer-name">Admin</div>
                    <div class="adm-footer-role">Administrator</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="adm-main">
        <div class="adm-topbar">
            <div class="adm-topbar-title">Manage Users</div>

        </div>

        <div class="adm-content">
            <!-- Stat Cards -->
            <div class="adm-stat-grid" id="user-stats" style="grid-template-columns:repeat(3,1fr);">
                <div class="adm-loading" style="grid-column:1/-1;"><div class="adm-spinner"></div></div>
            </div>

            <div class="adm-table-card">
                <div class="adm-table-hd">
                    <div class="adm-table-ttl">All Registered Users</div>
                    <div class="adm-table-actions">
                        <input type="text" class="adm-search" id="user-search" placeholder="Search by name or email..." oninput="filterUsers()">
                        <select class="adm-select" id="role-filter" onchange="filterUsers()">
                            <option value="">All Roles</option>
                            <option value="customer">Customers</option>
                            <option value="admin">Admins</option>
                        </select>
                    </div>
                </div>
                <div id="users-table-wrap">
                    <div class="adm-loading"><div class="adm-spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- User Detail Modal -->
<div class="adm-modal-overlay" id="user-modal">
    <div class="adm-modal">
        <div class="adm-modal-hd">
            <div class="adm-modal-ttl" id="user-modal-ttl">User Details</div>
            <button class="adm-modal-close" onclick="closeUserModal()">&times;</button>
        </div>
        <div class="adm-modal-body" id="user-modal-body"></div>
        <div class="adm-modal-footer">
            <div style="flex:1;display:flex;align-items:center;gap:10px;">
                <label style="font-size:13px;font-weight:800;color:#555;">Role:</label>
                <select class="adm-select" id="modal-role-select">
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button class="adm-btn adm-btn-primary" onclick="updateUserRole()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
                Update Role
            </button>
            <button class="adm-btn adm-btn-ghost" onclick="closeUserModal()">Close</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="../js/product-img.js"></script>
<script src="../js/admin.js"></script>
<script>
let allUsers = [];
let currentUserId = null;

function escHtml(str) { const d=document.createElement('div');d.textContent=String(str||'');return d.innerHTML; }
function formatDate(ds){if(!ds)return'—';return new Date(ds).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function showToast2(msg,type='success'){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>{t.className='toast';},3200);}

function getAvatarColor(name) {
    const colors = ['#6CB023','#1565c0','#f57c00','#6a1b9a','#c62828','#00838f'];
    let hash = 0;
    for (let i = 0; i < (name||'').length; i++) hash = (name||'').charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('user')||'null');
    if (user) {
        const n = document.getElementById('adm-footer-name');
        const a = document.getElementById('adm-avatar');
        if (n) n.textContent = user.name || 'Admin';
        if (a && user.name) a.textContent = user.name.charAt(0).toUpperCase();
    }
    loadUsers();
});

async function loadUsers() {
    try {
        const res  = await fetch('../api/users.php?action=list');
        const data = await res.json();
        allUsers = data.users || [];

        const admins    = allUsers.filter(u => u.role === 'admin').length;
        const customers = allUsers.filter(u => u.role === 'customer').length;
        const totalSpent = allUsers.reduce((s,u) => s + parseFloat(u.total_spent||0), 0);

        document.getElementById('user-stats').innerHTML = `
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
                <div class="adm-stat-info"><span class="adm-stat-num">${allUsers.length}</span><div class="adm-stat-lbl">Total Users</div></div>
            </div>
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                <div class="adm-stat-info"><span class="adm-stat-num">${customers}</span><div class="adm-stat-lbl">Customers</div></div>
            </div>
            <div class="adm-stat-card">
                <div class="adm-stat-icon si-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
                <div class="adm-stat-info"><span class="adm-stat-num">&#2547;${totalSpent.toFixed(0)}</span><div class="adm-stat-lbl">Total Revenue</div></div>
            </div>`;

        renderUsers(allUsers);
    } catch(e) {
        document.getElementById('users-table-wrap').innerHTML = `<div style="padding:24px;color:#c62828;font-weight:700;">Failed to load users. Make sure the server is running.</div>`;
        document.getElementById('user-stats').innerHTML = '';
    }
}

function filterUsers() {
    const search = (document.getElementById('user-search')?.value || '').toLowerCase();
    const role   = document.getElementById('role-filter')?.value || '';
    const filtered = allUsers.filter(u => {
        const matchSearch = !search ||
            (u.name||'').toLowerCase().includes(search) ||
            (u.email||'').toLowerCase().includes(search);
        const matchRole = !role || u.role === role;
        return matchSearch && matchRole;
    });
    renderUsers(filtered);
}

function renderUsers(users) {
    const wrap = document.getElementById('users-table-wrap');
    if (!users.length) {
        wrap.innerHTML = `<div class="adm-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>No users found.</p></div>`;
        return;
    }
    wrap.innerHTML = `<div style="overflow-x:auto;"><table class="adm-tbl">
        <thead><tr>
            <th>User</th><th>Contact</th><th>Role</th><th>Orders</th><th>Total Spent</th><th>Joined</th><th>Actions</th>
        </tr></thead>
        <tbody>${users.map(u => {
            const color = getAvatarColor(u.name);
            const initial = (u.name||'?').charAt(0).toUpperCase();
            return `<tr>
                <td>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div style="width:40px;height:40px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0;font-family:'Josefin Sans',sans-serif;">${initial}</div>
                        <div>
                            <span style="font-weight:800;color:#1c1c1e;display:block;">${escHtml(u.name||'—')}</span>
                            <span style="font-size:12px;color:#888;">#${String(u.id).padStart(4,'0')}</span>
                        </div>
                    </div>
                </td>
                <td>
                    <div style="font-weight:600;color:#333;">${escHtml(u.email||'—')}</div>
                    <div style="font-size:12px;color:#888;">${escHtml(u.phone||'—')}</div>
                </td>
                <td>${u.role === 'admin' ? '<span class="adm-badge ab-purple">Admin</span>' : '<span class="adm-badge ab-green">Customer</span>'}</td>
                <td><strong>${u.order_count||0}</strong></td>
                <td><strong style="color:#6CB023;">&#2547;${parseFloat(u.total_spent||0).toFixed(2)}</strong></td>
                <td style="color:#888;font-size:12.5px;">${formatDate(u.created_at)}</td>
                <td>
                    <div style="display:flex;gap:7px;">
                        <button class="adm-btn adm-btn-blue adm-btn-sm" onclick="openUserModal('${escHtml(String(u.id))}')">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            View
                        </button>
                        <button class="adm-btn adm-btn-danger adm-btn-sm" onclick="deleteUser('${escHtml(String(u.id))}', '${escHtml(u.name)}')">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
                            Delete
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('')}
        </tbody></table></div>`;
}

function openUserModal(userId) {
    currentUserId = userId;
    const u = allUsers.find(x => String(x.id) === String(userId));
    if (!u) return;

    document.getElementById('user-modal-ttl').textContent = u.name || 'User Details';
    document.getElementById('modal-role-select').value = u.role || 'customer';

    const color   = getAvatarColor(u.name);
    const initial = (u.name||'?').charAt(0).toUpperCase();

    document.getElementById('user-modal-body').innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #f0f4f0;">
            <div style="width:60px;height:60px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;font-family:'Josefin Sans',sans-serif;flex-shrink:0;">${initial}</div>
            <div>
                <div style="font-family:'Josefin Sans',sans-serif;font-size:20px;font-weight:700;color:#1c1c1e;">${escHtml(u.name)}</div>
                <div style="font-size:13px;color:#888;">${escHtml(u.email)}</div>
            </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div style="background:#fafcf8;border-radius:10px;padding:14px;">
                <div style="font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;">Phone</div>
                <div style="font-weight:700;">${escHtml(u.phone||'Not provided')}</div>
            </div>
            <div style="background:#fafcf8;border-radius:10px;padding:14px;">
                <div style="font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;">Member Since</div>
                <div style="font-weight:700;">${formatDate(u.created_at)}</div>
            </div>
            <div style="background:#fafcf8;border-radius:10px;padding:14px;">
                <div style="font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;">Total Orders</div>
                <div style="font-weight:800;font-size:20px;color:#1565c0;">${u.order_count||0}</div>
            </div>
            <div style="background:#fafcf8;border-radius:10px;padding:14px;">
                <div style="font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;">Total Spent</div>
                <div style="font-weight:800;font-size:20px;color:#6CB023;">&#2547;${parseFloat(u.total_spent||0).toFixed(2)}</div>
            </div>
            ${u.address ? `<div style="background:#fafcf8;border-radius:10px;padding:14px;grid-column:1/-1;">
                <div style="font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;">Address</div>
                <div style="font-weight:700;color:#333;">${escHtml(u.address)}</div>
            </div>` : ''}
        </div>`;

    document.getElementById('user-modal').classList.add('open');
}

function closeUserModal() {
    document.getElementById('user-modal').classList.remove('open');
    currentUserId = null;
}

async function updateUserRole() {
    if (!currentUserId) return;
    const newRole = document.getElementById('modal-role-select').value;
    try {
        const res  = await fetch('../api/users.php?action=update_role', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: currentUserId, role: newRole })
        });
        const data = await res.json();
        if (data.status === 'success') {
            showToast2('User role updated');
            const idx = allUsers.findIndex(u => String(u.id) === String(currentUserId));
            if (idx > -1) allUsers[idx].role = newRole;
            filterUsers();
            closeUserModal();
        } else {
            showToast2(data.message || 'Update failed', 'error');
        }
    } catch { showToast2('Connection error', 'error'); }
}

async function deleteUser(id, name) {
    if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
    try {
        const res  = await fetch('../api/users.php?action=delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (data.status === 'success') {
            showToast2('User deleted');
            loadUsers();
        } else {
            showToast2(data.message || 'Delete failed', 'error');
        }
    } catch { showToast2('Connection error', 'error'); }
}

document.getElementById('user-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('user-modal')) closeUserModal();
});
</script>
</body>
</html>
